name: Vulkan offscreen validation

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulkan-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lavapipe-offscreen:
    name: Mesa lavapipe offscreen and X11 presentation
    runs-on: ubuntu-24.04
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install software Vulkan driver and validation layer
        run: |
          sudo apt-get update
          sudo apt-get install --yes mesa-vulkan-drivers vulkan-validationlayers vulkan-tools xvfb xauth libxkbcommon-x11-0
      - name: Discover and verify lavapipe and validation layer
        run: |
          echo "Installed Vulkan ICD manifests:"
          find /usr/share/vulkan/icd.d -maxdepth 1 -type f -print
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -iname 'lvp_icd*.json' -print -quit)"
          if [[ -z "$ICD" ]]; then
            echo "Mesa lavapipe ICD manifest was not installed"
            dpkg -L mesa-vulkan-drivers | grep -i vulkan || true
            exit 1
          fi
          VALIDATION_LAYER="$(find /usr/share/vulkan/explicit_layer.d -maxdepth 1 -type f -iname '*khronos*validation*.json' -print -quit)"
          if [[ -z "$VALIDATION_LAYER" ]]; then
            echo "Khronos validation layer manifest was not installed"
            dpkg -L vulkan-validationlayers | grep -i json || true
            exit 1
          fi
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | tee /tmp/vulkan-summary.txt
          grep -Eiq 'llvmpipe|lavapipe' /tmp/vulkan-summary.txt
      - name: Run offscreen rendering and readback validation
        run: cargo test -p z-ideal-renderer --all-features --test vulkan_offscreen -- --ignored --nocapture

      - name: Run X11 swapchain presentation and depth-attachment validation
        run: xvfb-run -a cargo test -p z-ideal-renderer --all-features --test vulkan_swapchain -- --ignored --nocapture
