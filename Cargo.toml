[workspace]
resolver = "3"
members = [
    "crates/z-ideal-core",
    "crates/z-ideal-math",
    "crates/z-ideal-scene",
    "crates/z-ideal-assets",
    "crates/z-ideal-renderer",
    "crates/z-ideal-physics",
    "crates/z-ideal-scripting",
    "crates/z-ideal-audio",
    "crates/z-ideal-platform",
    "crates/z-ideal-test-support",
    "crates/z-ideal-editor",
    "crates/z-ideal-runtime",
    "apps/editor",
    "apps/runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ash = { version = "=0.38.0", default-features = false, features = ["debug", "loaded", "std"] }
ash-window = "=0.13.0"
raw-window-handle = "=0.6.2"
glam = { version = "=0.34.3", features = ["serde"] }
gltf = "=1.4.1"
base64 = "=0.13.1"
image = { version = "=0.25.9", default-features = false, features = ["jpeg", "png"] }
urlencoding = "=2.1.3"
shaderc = { version = "=0.10.1", features = ["build-from-source"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
winit = "=0.30.13"
boxddd = "=0.4.0"
z-ideal-math = { path = "crates/z-ideal-math" }

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
